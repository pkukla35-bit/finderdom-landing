<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Płatność anulowana — FinderDom.pl</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0B1836;color:#fff;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .bg-orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.3}
  .orb1{width:500px;height:500px;background:#FFB800;top:-100px;left:-100px}
  .orb2{width:400px;height:400px;background:#4A90E2;bottom:-100px;right:-100px}
  .wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
  .card{width:100%;max-width:460px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:44px 32px;backdrop-filter:blur(10px);text-align:center}
  .icon{width:76px;height:76px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:38px}
  h1{font-size:24px;font-weight:900;margin-bottom:10px;letter-spacing:-0.5px}
  .subtitle{color:#a3b3d1;font-size:14px;line-height:1.6;margin-bottom:24px}
  .btns{display:flex;flex-direction:column;gap:10px}
  .btn{display:block;padding:14px;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;transition:all 0.15s ease;font-family:inherit;text-decoration:none;border:none}
  .btn-primary{background:linear-gradient(135deg,#FFB800,#FFA200);color:#0B1836}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,184,0,0.3)}
  .btn-ghost{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,0.1)}
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="wrap">
  <div class="card">
    <div class="icon">💳</div>
    <h1>Płatność anulowana</h1>
    <p class="subtitle">Nie pobrano żadnych środków. Możesz spróbować ponownie w dowolnej chwili — Twoje konto pozostaje bez zmian.</p>
    <div class="btns">
      <a href="/konto" class="btn btn-primary">Wróć do konta →</a>
      <a href="/" class="btn btn-ghost">Strona główna</a>
    </div>
  </div>
</div>
</body>
</html>
