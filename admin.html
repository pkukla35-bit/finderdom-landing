<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0B1836;color:#e6e9f2;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5}
  .topnav{background:rgba(11,24,54,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:100;padding:14px 20px}
  .nav-inner{max-width:1400px;margin:auto;display:flex;align-items:center;gap:24px}
  .logo{font-size:18px;font-weight:900;color:#FFB800;text-decoration:none}
  .nav-badge{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:900;letter-spacing:1px}
  .nav-links{display:flex;gap:14px;align-items:center;margin-left:auto;font-size:13px}
  .nav-links a{color:#c5d0e6;text-decoration:none;font-weight:600;padding:6px 12px;border-radius:8px}
  .nav-links a:hover{background:rgba(255,255,255,0.05);color:#FFB800}
  main{max-width:1400px;margin:auto;padding:24px 20px 80px}
  h1{font-size:28px;font-weight:900;margin:0 0 6px}
  .sub{color:#8ba3d4;font-size:14px;margin-bottom:24px}
  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.08);flex-wrap:wrap}
  .tab{padding:10px 18px;color:#8ba3d4;background:none;border:none;font-weight:700;cursor:pointer;font-size:14px;border-bottom:3px solid transparent;font-family:inherit}
  .tab.active{color:#FFB800;border-color:#FFB800}
  .tab:hover:not(.active){color:#e6e9f2}
  section{display:none}
  section.active{display:block}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
  .card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:18px 20px}
  .card-title{font-size:11px;color:#8ba3d4;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .card-value{font-size:28px;font-weight:900;color:#fff;line-height:1;margin-bottom:6px}
  .card-value.amber{color:#FFB800}
  .card-value.green{color:#4ade80}
  .card-value.blue{color:#60a5fa}
  .card-value.rose{color:#fb7185}
  .card-sub{font-size:12px;color:#8ba3d4}
  .card-sub strong{color:#c5d0e6}
  .section-title{font-size:16px;font-weight:800;color:#FFB800;margin:28px 0 12px}
  table{width:100%;border-collapse:collapse;background:rgba(255,255,255,0.03);border-radius:12px;overflow:hidden;font-size:13px}
  th{background:rgba(255,184,0,0.08);color:#FFB800;font-weight:700;text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid rgba(255,255,255,0.08)}
  td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.05);color:#e6e9f2;vertical-align:top}
  tr:hover td{background:rgba(255,255,255,0.02)}
  .tag{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px}
  .tag-free{background:rgba(139,163,212,0.15);color:#8ba3d4}
  .tag-individual{background:rgba(96,165,250,0.15);color:#60a5fa}
  .tag-business{background:rgba(255,184,0,0.15);color:#FFB800}
  .tag-trial{background:rgba(74,222,128,0.15);color:#4ade80}
  .tag-agent{background:rgba(251,113,133,0.15);color:#fb7185}
  .empty{text-align:center;color:#8ba3d4;padding:40px 20px;font-style:italic}
  .stripe-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:22px;max-width:820px}
  .stripe-card .ok{color:#4ade80}.stripe-card .warn{color:#fbbf24}.stripe-card .bad{color:#f87171}
  .btn-sm{padding:6px 12px;background:rgba(255,184,0,0.12);border:1px solid rgba(255,184,0,0.35);color:#FFB800;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;min-height:32px}
  .btn-sm:hover{background:rgba(255,184,0,0.2)}
  .loader{text-align:center;color:#8ba3d4;padding:40px 20px}
  .loader::before{content:'⟳';display:inline-block;font-size:32px;color:#FFB800;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .refresh-btn{background:rgba(255,184,0,0.15);color:#FFB800;border:1px solid rgba(255,184,0,0.3);border-radius:8px;padding:6px 14px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
  .refresh-btn:hover{background:rgba(255,184,0,0.25)}
  .row-actions{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;padding:14px 18px;border-radius:12px;margin:20px 0}
  .login-box{max-width:400px;margin:80px auto;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:32px 28px;text-align:center}
  .login-box h2{margin:0 0 8px;color:#FFB800}
  .login-box p{color:#c5d0e6;font-size:14px;margin:0 0 20px}
  .login-box .btn{display:inline-block;background:#FFB800;color:#0B1836;font-weight:800;padding:10px 22px;border-radius:100px;text-decoration:none;font-size:14px}
  .link{color:#60a5fa;text-decoration:none;font-size:12px}
  .link:hover{text-decoration:underline}
  .mono{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:12px;color:#8ba3d4}
  .cell-email{font-weight:600;color:#fff}
  .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px;margin-bottom:24px}
  .chart-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:18px 20px}
  .chart-title{font-size:13px;font-weight:800;color:#e6e9f2;margin-bottom:14px;display:flex;align-items:center;gap:6px}
  .chart-title .chart-total{margin-left:auto;color:#8ba3d4;font-weight:600;font-size:12px}
  @media (max-width:768px){
    .stats-grid{grid-template-columns:repeat(2,1fr)}
    .card-value{font-size:22px}
    table{font-size:11px}
    th,td{padding:8px 10px}
    .nav-links a{padding:4px 8px;font-size:11px}
    .charts-grid{grid-template-columns:1fr}
  }
.btn-mini{background:rgba(255,184,0,0.15);border:1px solid rgba(255,184,0,0.4);color:#FFB800;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-mini:hover{background:rgba(255,184,0,0.3)}
</style>

<body>
<nav class="topnav">
  <div class="nav-inner">
    <a href="/" class="logo">🏠 FinderDom.pl</a>
    <span class="nav-badge">🔐 ADMIN</span>
    <div class="nav-links">
      <a href="/szukaj">Wyszukiwarka</a>
      <a href="/konto">Moje konto</a>
      <a href="#" onclick="doLogout();return false">Wyloguj</a>
    </div>
  </div>
</nav>

<main id="main">
  <div class="loader" id="initLoader">Ładuję panel admina…</div>
</main>

<template id="tpl-dashboard">
  <h1>📊 Panel Admina</h1>
  <div class="sub">Zalogowany jako <strong id="adminEmail" style="color:#FFB800"></strong> · Ostatnie odświeżenie: <span id="lastRefresh">—</span></div>

  <div class="tabs">
    <button class="tab active" data-tab="overview">📊 Przegląd</button>
    <button class="tab" data-tab="users">👥 Użytkownicy</button>
    <button class="tab" data-tab="payments">💳 Płatności</button>
    <button class="tab" data-tab="leads">📩 Leady</button>
    <button class="tab" data-tab="scrapers">🕷️ Scrapery</button>
    <button class="tab" data-tab="stripe">💰 Płatności Stripe</button>
    <button class="tab" data-tab="mailing">✉️ Mailing</button>
    <button class="tab" data-tab="ai">🤖 Czat AI</button>
  </div>

  <!-- OVERVIEW -->
  <section class="active" data-panel="overview">
    <div class="row-actions">
      <button class="refresh-btn" onclick="loadStats();loadTimeseries()">↻ Odśwież</button>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <span class="mono" style="color:#8ba3d4;font-size:11px">Okres wykresu:</span>
        <select id="chartDays" onchange="loadTimeseries()" style="background:rgba(255,255,255,0.05);color:#e6e9f2;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:4px 8px;font-size:12px;font-family:inherit;cursor:pointer">
          <option value="7">7 dni</option>
          <option value="14">14 dni</option>
          <option value="30" selected>30 dni</option>
          <option value="60">60 dni</option>
          <option value="90">90 dni</option>
        </select>
      </div>
    </div>
    <div class="stats-grid" id="statsCards"></div>

    <!-- Wykresy -->
    <div class="section-title" style="margin-top:32px">📈 Trendy dziennie</div>
    <div class="charts-grid">
      <div class="chart-box">
        <div class="chart-title">
          <span style="color:#60a5fa">●</span> Rejestracje / dzień
          <span class="chart-total" id="regTotal">—</span>
        </div>
        <div style="position:relative;height:220px"><canvas id="chartRegs"></canvas></div>
      </div>
      <div class="chart-box">
        <div class="chart-title">
          <span style="color:#4ade80">●</span> Przychód / dzień
          <span class="chart-total" id="revTotal">—</span>
        </div>
        <div style="position:relative;height:220px"><canvas id="chartRevenue"></canvas></div>
      </div>
    </div>
  </section>

  <!-- USERS -->
  <section data-panel="users">
    <div class="row-actions">
      <button class="refresh-btn" onclick="loadUsers()">↻ Odśwież</button>
      <span class="mono" id="usersCount"></span>
    </div>
    <div id="usersTable" class="loader">Ładuję…</div>
  </section>

  <!-- PAYMENTS -->
  <section data-panel="payments">
    <div class="row-actions">
      <button class="refresh-btn" onclick="loadPayments()">↻ Odśwież</button>
      <span class="mono" id="paymentsCount"></span>
    </div>
    <div id="paymentsTable" class="loader">Ładuję…</div>
  </section>

  <!-- LEADS -->
  <section data-panel="leads">
    <div class="row-actions">
      <button class="refresh-btn" onclick="loadLeads()">↻ Odśwież</button>
      <span class="mono" id="leadsCount"></span>
    </div>
    <div id="leadsTable" class="loader">Ładuję…</div>
  </section>

  <!-- SCRAPERS -->
  <section data-panel="scrapers">
    <div class="row-actions">
      <button class="refresh-btn" onclick="loadScrapers()">↻ Odśwież</button>
      <span class="mono" id="scrapersCount"></span>
    </div>
    <div id="scrapersTable" class="loader">Ładuję…</div>
  </section>

  <section data-panel="stripe">
    <div class="stripe-card">
      <h2 style="margin:0 0 6px;font-size:18px">Podłączenie Stripe (prawdziwe płatności)</h2>
      <p style="color:#8ba3d4;font-size:13px;margin:0 0 14px;line-height:1.5">
        Wystarczy <b>jeden klucz</b>. W Stripe: dolny pasek <b>Developers → API keys → Secret key → Reveal</b> (zaczyna się od <span class="mono">sk_live_</span>).
        Wklej go poniżej — webhook, faktury i aktywację planów skonfiguruję automatycznie. Klucz <span class="mono">pk_live_</span> (publiczny) tu nie pasuje.
      </p>
      <div id="stripeStatus" class="loader">Ładuję…</div>
      <form id="stripeForm" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
        <input type="password" id="stripeKey" placeholder="sk_live_…" autocomplete="off" style="flex:1;min-width:280px;padding:12px 14px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-family:monospace;font-size:14px;min-height:44px">
        <button type="submit" class="refresh-btn" id="stripeSaveBtn" style="min-height:44px">💾 Zapisz i skonfiguruj</button>
      </form>
      <div id="stripeMsg" style="margin-top:10px;font-size:13px"></div>
    </div>
  </section>

  <section data-panel="mailing">
    <div class="stripe-card" style="max-width:1100px">
      <h2 style="margin:0 0 6px;font-size:18px">✉️ Mailing</h2>
      <p style="color:#8ba3d4;font-size:13px;margin:0 0 14px;line-height:1.5">
        <b>Automat</b> wysyła z systemu tylko wiadomości dotyczące konta użytkownika (powitanie po rejestracji z instrukcją, powiadomienie o końcu okresu próbnego) — codziennie rano, każdą raz, z linkiem „Wypisz się”.
        <b>Szablony marketingowe</b> (wycena, plan, „wróć do nas”) są gotowe do pobrania jako HTML — wysyłasz je ze swojego narzędzia do newsletterów (Mailchimp, FreshMail, MailerLite) do osób, które wyraziły zgodę marketingową. Skrzynka systemowa służy do powiadomień, nie do kampanii.
      </p>
      <div id="mailingStatus" class="loader">Ładuję…</div>
      <details id="smtpBox" style="margin-top:14px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 16px">
        <summary style="cursor:pointer;font-weight:800;font-size:14px">📮 Własna skrzynka nadawcza (SMTP, np. home.pl)</summary>
        <p style="color:#8ba3d4;font-size:13px;margin:10px 0;line-height:1.5">Dane znajdziesz w panelu home.pl → Poczta → Twoja skrzynka → <b>Serwery pocztowe</b>. Login to pełny adres e-mail. Port <b>587</b> (STARTTLS) lub 465 (SSL). Po zapisaniu system od razu sprawdzi logowanie.</p>
        <form id="smtpForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
          <input id="smtpHost" placeholder="serwer123456.home.pl" required style="padding:11px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;min-height:44px">
          <input id="smtpPort" type="number" value="587" placeholder="587" required style="padding:11px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;min-height:44px">
          <input id="smtpUser" type="email" placeholder="kontakt@finderdom.pl (login)" required autocomplete="off" style="padding:11px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;min-height:44px">
          <input id="smtpPass" type="password" placeholder="hasło do skrzynki" required autocomplete="new-password" style="padding:11px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;min-height:44px">
          <button type="submit" class="refresh-btn" id="smtpSaveBtn" style="min-height:44px">💾 Zapisz i sprawdź połączenie</button>
          <button type="button" class="refresh-btn" id="smtpDelBtn" style="min-height:44px;display:none" onclick="deleteSmtp()">🗑 Usuń skrzynkę</button>
        </form>
        <div id="smtpMsg" style="margin-top:8px;font-size:13px"></div>
      </details>
      <div id="manualMailBox" style="margin-top:14px;background:rgba(255,184,0,0.06);border:1px solid rgba(255,184,0,0.35);border-radius:12px;padding:16px">
        <h3 style="margin:0 0 6px;font-size:15px">📨 Wyślij ofertę do biur / firm (ręcznie, z Twojej skrzynki)</h3>
        <p style="color:#8ba3d4;font-size:12px;margin:0 0 12px;line-height:1.5">Wklej adresy e-mail biur (po przecinku, spacji lub każdy w nowej linii, max 20 na raz), wybierz szablon i kliknij Wyślij. System pomija osoby wypisane, adresy z listy „nie” i tych, którzy dostali ten szablon w ciągu 30 dni. Wysyłaj w małych partiach — kto odpisze „nie”, dodaj go poniżej do listy wykluczeń.</p>
        <form id="manualMailForm" style="display:grid;gap:10px">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">
            <select id="mmTemplate" style="padding:11px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;min-height:44px"></select>
            <input id="mmSubject" placeholder="Temat wiadomości" required style="padding:11px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;min-height:44px">
          </div>
          <textarea id="mmEmails" rows="4" placeholder="biuro1@example.pl, biuro2@example.pl&#10;biuro3@example.pl" required style="padding:11px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-family:inherit;font-size:13px"></textarea>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <button type="submit" id="mmSendBtn" class="refresh-btn" style="min-height:44px">📨 Wyślij</button>
            <a id="mmPreview" href="#" target="_blank" style="color:#FFB800;font-size:13px;font-weight:700">👁 Podgląd szablonu</a>
            <span id="mmMsg" style="font-size:13px"></span>
          </div>
        </form>
        <div id="mmResults" style="margin-top:10px;font-size:13px"></div>
        <div style="margin-top:14px;padding:12px 14px;background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.35);border-radius:10px">
          <div style="font-weight:800;font-size:14px;margin-bottom:4px">🔁 Follow-up do wszystkich wcześniej zaadresowanych biur</div>
          <p style="color:#8ba3d4;font-size:12px;margin:0 0 10px;line-height:1.5">Wysyła wybrany wyżej szablon (i temat) do każdego adresu, który kiedykolwiek dostał mailing — z pominięciem listy „nie”, wypisanych, tych którzy odpisali oraz tych, którzy ten szablon już dostali. Wysyłka idzie partiami po 8 co ok. 10 sekund (łagodniej dla skrzynki home.pl); zostaw tę kartę otwartą do końca.</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <button type="button" id="mmFollowCount" class="refresh-btn" style="min-height:44px">🔢 Policz odbiorców</button>
            <button type="button" id="mmFollowSend" class="refresh-btn" style="min-height:44px;display:none">🚀 Wyślij do wszystkich</button>
            <button type="button" id="mmFollowStop" class="refresh-btn" style="min-height:44px;display:none">⏹ Zatrzymaj</button>
            <span id="mmFollowMsg" style="font-size:13px"></span>
          </div>
          <div id="mmFollowResults" style="margin-top:8px;font-size:12px;max-height:220px;overflow:auto"></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08)">
          <input id="mmOptout" placeholder="ktoś odpisał „nie”? wpisz jego e-mail" style="flex:1;min-width:220px;padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;min-height:44px">
          <button type="button" id="mmOptoutBtn" class="refresh-btn" style="min-height:44px">🚫 Dodaj do listy „nie”</button>
          <button type="button" id="mmCheckReplies" class="refresh-btn" style="min-height:44px" title="Łączy się z Twoją skrzynką (IMAP, te same dane co SMTP) i sprawdza, kto odpisał. Odpowiedź „nie” trafia automatycznie na listę wykluczeń.">🔎 Sprawdź odpowiedzi w skrzynce</button>
        </div>
        <div id="mmToCall" style="margin-top:12px"></div>
        <div id="mmLog" style="margin-top:12px;font-size:12px;color:#8ba3d4"></div>
      </div>
      <div id="mailingTemplates" style="margin-top:18px"></div>
      <div id="mailingPreview" style="margin-top:18px"></div>
      <div id="mailingLog" style="margin-top:18px"></div>
    </div>
  </section>

  <section data-panel="ai">
    <div class="stripe-card" style="max-width:1100px">
      <h2 style="margin:0 0 6px;font-size:18px">🤖 Czat AI (dymek na stronach)</h2>
      <p style="color:#8ba3d4;font-size:13px;margin:0 0 14px;line-height:1.5">Asystent odpowiada zalogowanym użytkownikom (także Free) na pytania o portal, plany, CRM i wyceny. Gdy klient prosi o kontakt, zbiera imię / e-mail / telefon i wysyła Ci powiadomienie e-mail. Koszt: z salda klucza Emergent.</p>

      <form id="aiForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px">

<script>
const API_BASE = (typeof window !== 'undefined' && window.EXPO_BACKEND_URL) ? window.EXPO_BACKEND_URL + '/api' : '/api';
const TOKEN_KEY = 'finderdom_token';

function setHtml(id, html){ const el = document.getElementById(id); if (!el) return; el.classList.remove('loader'); el.innerHTML = html; }
function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
function doLogout(){ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('finderdom_user'); location.href='/logowanie'; }

async function api(path){
  const token = getToken();
  if (!token) throw new Error('AUTH_REQUIRED');
  const r = await fetch(API_BASE + path, { headers: { 'Authorization': 'Bearer ' + token } });
  if (r.status === 401) { doLogout(); throw new Error('SESSION_EXPIRED'); }
  if (r.status === 403) throw new Error('NOT_ADMIN');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString('pl-PL', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('pl-PL', {day:'2-digit',month:'2-digit',year:'2-digit'});
}
function fmtMoney(pln){
  if (pln == null) return '—';
  return Number(pln).toLocaleString('pl-PL', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' zł';
}
function escapeHtml(s){
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderLogin(msg){
  const tpl = document.getElementById('tpl-login').content.cloneNode(true);
  if (msg) tpl.querySelector('#loginMsg').textContent = msg;
  document.getElementById('main').innerHTML = '';
  document.getElementById('main').appendChild(tpl);
}

function initTabs(){
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('section[data-panel]').forEach(s => s.classList.remove('active'));
      t.classList.add('active');
      const panel = document.querySelector(`section[data-panel="${t.dataset.tab}"]`);
      if (panel) panel.classList.add('active');
      // Lazy load
      if (t.dataset.tab === 'users' && !window._loadedUsers) { window._loadedUsers = true; loadUsers(); }
      if (t.dataset.tab === 'payments' && !window._loadedPayments) { window._loadedPayments = true; loadPayments(); }
      if (t.dataset.tab === 'leads' && !window._loadedLeads) { window._loadedLeads = true; loadLeads(); }
      if (t.dataset.tab === 'scrapers' && !window._loadedScrapers) { window._loadedScrapers = true; loadScrapers(); }
      if (t.dataset.tab === 'stripe') loadStripe();
      if (t.dataset.tab === 'mailing') loadMailing();
      if (t.dataset.tab === 'ai') loadAi();
    });
  });
}

// Chart.js instances (żeby móc je zniszczyć przed re-renderem)
window._charts = { regs: null, revenue: null };

async function loadTimeseries(){
  const daysSel = document.getElementById('chartDays');
  const days = daysSel ? parseInt(daysSel.value, 10) : 30;
  try {
    const d = await api(`/admin/timeseries?days=${days}`);
    const labels = d.series.map(x => {
      const dt = new Date(x.date);
      return dt.toLocaleDateString('pl-PL', {day:'2-digit',month:'2-digit'});
    });
    const regs = d.series.map(x => x.registrations);
    const payments = d.series.map(x => x.payments_pln);

    const totalRegs = regs.reduce((a,b) => a+b, 0);
    const totalRev = payments.reduce((a,b) => a+b, 0);
    document.getElementById('regTotal').textContent = `Suma ${totalRegs} rejestracji`;
    document.getElementById('revTotal').textContent = `Suma ${fmtMoney(totalRev)}`;

    if (typeof Chart === 'undefined') {
      console.warn('Chart.js not loaded yet');
      return;
    }

    const commonOpts = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(11,24,54,0.95)',
          borderColor: 'rgba(255,184,0,0.3)',
          borderWidth: 1,
          titleColor: '#FFB800',
          bodyColor: '#e6e9f2',
          padding: 10,
          cornerRadius: 8,
        },
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.04)' },
          ticks: { color: '#8ba3d4', font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 },
        },
        y: {
          beginAtZero: true,
          grid: { color: 'rgba(255,255,255,0.04)' },
          ticks: { color: '#8ba3d4', font: { size: 10 }, precision: 0 },
        },
      },
    };

    // Rejestracje (niebieski bar)
    if (window._charts.regs) window._charts.regs.destroy();
    const ctx1 = document.getElementById('chartRegs').getContext('2d');
    window._charts.regs = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Rejestracje',
          data: regs,
          backgroundColor: 'rgba(96,165,250,0.6)',
          borderColor: '#60a5fa',
          borderWidth: 1,
          borderRadius: 4,
        }],
      },
      options: commonOpts,
    });

    // Przychód (zielona linia)
    if (window._charts.revenue) window._charts.revenue.destroy();
    const ctx2 = document.getElementById('chartRevenue').getContext('2d');
    const revOpts = JSON.parse(JSON.stringify(commonOpts));
    // Custom tooltip formatter dla PLN
    revOpts.plugins.tooltip.callbacks = {}; // will set below
    window._charts.revenue = new Chart(ctx2, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Przychód',
          data: payments,
          borderColor: '#4ade80',
          backgroundColor: 'rgba(74,222,128,0.15)',
          borderWidth: 2,
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: '#4ade80',
          pointBorderColor: '#0B1836',
          pointBorderWidth: 1,
        }],
      },
      options: {
        ...revOpts,
        plugins: {
          ...revOpts.plugins,
          tooltip: {
            ...revOpts.plugins.tooltip,
            callbacks: {
              label: (ctx) => `${fmtMoney(ctx.parsed.y)}`,
            },
          },
        },
        scales: {
          ...revOpts.scales,
          y: {
            ...revOpts.scales.y,
            ticks: {
              ...revOpts.scales.y.ticks,
              callback: (v) => v + ' zł',
            },
          },
        },
      },
    });
  } catch(e){
    console.error('loadTimeseries:', e);
    document.getElementById('regTotal').textContent = 'Błąd ładowania';
    document.getElementById('revTotal').textContent = 'Błąd ładowania';
  }
}

function tierTag(tier, isTrial){
  const map = {free:'tag-free', individual:'tag-individual', solo:'tag-business', business:'tag-business'};
  const cls = map[tier] || 'tag-free';
  const label = tier === 'free' ? 'FREE' : tier === 'individual' ? 'INDIVIDUAL' : tier === 'business' ? 'BUSINESS' : tier === 'solo' ? 'SOLO (90 zł)' : tier.toUpperCase();
  const trialBadge = isTrial ? '<span class="tag tag-trial" style="margin-left:6px">TRIAL</span>' : '';
  return `<span class="tag ${cls}">${label}</span>${trialBadge}`;
}

// Admin: ręczne nadanie planu (free / individual / solo / business), bezterminowo lub na N dni
async function grantTier(id, email){
  const tier = prompt(`Plan dla ${email}:\n- business (Firmowy 199 zł)\n- solo (Biuro jednoosobowe 90 zł)\n- individual (Osobisty)\n- free (odbierz plan)`, 'business');
  if (!tier || !['business','solo','individual','free'].includes(tier.trim())) return;
  let days = null;
  if (tier.trim() !== 'free') {
    const d = prompt('Na ile dni? (puste = bezterminowo)', '');
    if (d === null) return;
    if (d.trim()) { days = parseInt(d, 10); if (!(days > 0)) { alert('Podaj liczbę dni > 0'); return; } }
  }
  try {
    const r = await fetch(API_BASE + `/admin/users/${id}/tier`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }, body: JSON.stringify({ tier: tier.trim(), days }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
    alert(`✅ ${email}: plan ${d.user.tier}${d.user.expires_at ? ' do ' + fmtDate(d.user.expires_at) : ''}`);
    loadUsers();
  } catch(e){ alert('Błąd: ' + e.message); }
}

async function apiPost(path, body){
  const r = await fetch(API_BASE + path, { method: 'POST', headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
  return d;
}

      msg.innerHTML = `<b>${r.remaining}</b> biur dostanie szablon „${escapeHtml(tpl)}”` + (r.sample.length ? ` — np. ${r.sample.slice(0,3).map(escapeHtml).join(', ')}…` : '');
      sendBtn.style.display = r.remaining > 0 ? '' : 'none';
    } catch(err) { msg.innerHTML = `<span class="bad">❌ ${escapeHtml(err.message)}</span>`; }
    finally { countBtn.disabled = false; }
    return;
  }
  // Wysyłka w pętli
  if (!confirm(`Wysłać szablon „${tpl}” do wszystkich wcześniej zaadresowanych biur?\nTemat: ${subject}`)) return;
  _mmFollowStop = false; sendBtn.disabled = true; countBtn.disabled = true; stopBtn.style.display = ''; stopBtn.disabled = false; out.innerHTML = '';
  let total = 0, failed = 0, batch = 0;
  try {
    while (!_mmFollowStop) {
      batch++;
      msg.innerHTML = `⏳ Partia ${batch}… wysłano dotąd ${total}`;
      const r = await apiPost('/admin/mailing/send-followup', { template: tpl, subject, dry_run: false, limit: 8 });
      total += r.sent; failed += r.failed;
      out.innerHTML += r.results.map(x => `<div>${escapeHtml(x.email)} — ${escapeHtml(x.status)}</div>`).join('');
      out.scrollTop = out.scrollHeight;
      if (r.remaining <= 0 || (r.sent === 0 && r.failed > 0)) break;
      await new Promise(res => setTimeout(res, 10000));
    }
    msg.innerHTML = `<span class="ok">✅ Gotowe: wysłano ${total}${failed ? `, błędów ${failed}` : ''}${_mmFollowStop ? ' (zatrzymano)' : ''}</span>`;
    loadManualMail();
  } catch(err) { msg.innerHTML = `<span class="bad">❌ ${escapeHtml(err.message)} — wysłano ${total}</span>`; }
  finally { sendBtn.disabled = false; countBtn.disabled = false; stopBtn.style.display = 'none'; }
});

document.addEventListener('click', async (e) => {
  if (e.target.id !== 'mmOptoutBtn') return;
  const inp = document.getElementById('mmOptout'); const v = inp.value.trim(); if (!v) return;
  try { const r = await apiPost('/admin/mailing/manual-optout', { email: v }); inp.value = ''; document.getElementById('mmMsg').innerHTML = `<span class="ok">🚫 ${escapeHtml(r.email)} nie dostanie już maili</span>`; loadManualMail(); }
  catch(err) { document.getElementById('mmMsg').innerHTML = `<span class="bad">❌ ${escapeHtml(err.message)}</span>`; }
});
// 🔎 Sprawdź odpowiedzi w skrzynce (IMAP)
document.addEventListener('click', async (e) => {
  if (e.target.id !== 'mmCheckReplies') return;
  const btn = e.target, msg = document.getElementById('mmMsg');
  btn.disabled = true; msg.innerHTML = '⏳ Łączę ze skrzynką…';
  try {
    const r = await apiPost('/admin/mailing/check-replies', {});
    if (r.note) msg.innerHTML = `<span style="color:#8ba3d4">${escapeHtml(r.note)}</span>`;
    else msg.innerHTML = `<span class="ok">✅ Sprawdzono. Nowe odpowiedzi: ${r.new_replies}${r.auto_replies ? ` · auto-odpowiedzi: ${r.auto_replies}` : ''}${r.optout_added ? ` · „nie” dodane do wykluczeń: ${r.optout_added}` : ''}</span>` + (r.replies && r.replies.length ? `<div style="margin-top:6px">${r.replies.map(x => `<div>${x.is_no ? '🚫' : x.auto ? '🤖' : '✉️'} ${escapeHtml(x.email)}${x.snippet ? ' — „' + escapeHtml(x.snippet.slice(0,100)) + '”' : ''}</div>`).join('')}</div>` : '');
    loadManualMail();
  } catch(err) { msg.innerHTML = `<span class="bad">❌ ${escapeHtml(err.message)}</span>`; }
  finally { btn.disabled = false; }
});
// 📞 Odpisał / 🚫 Nie — ręczne oznaczenia przy adresie
document.addEventListener('click', async (e) => {
  const b = e.target.closest('.mm-mark'); if (!b) return;
  const email = b.dataset.email, mark = b.dataset.mark;
  if (mark === 'optout' && !confirm(`Dodać ${email} do listy „nie”? Nie dostanie już żadnego maila z panelu.`)) return;
  b.disabled = true;
  try { await apiPost('/admin/mailing/manual-mark', { email, mark }); document.getElementById('mmMsg').innerHTML = `<span class="ok">✅ ${escapeHtml(email)} — ${mark === 'replied' ? 'oznaczony jako „odpisał”' : 'na liście „nie”'}</span>`; loadManualMail(); }
  catch(err) { document.getElementById('mmMsg').innerHTML = `<span class="bad">❌ ${escapeHtml(err.message)}</span>`; b.disabled = false; }
});

async function deleteSmtp(){
  if (!confirm('Usunąć dane skrzynki SMTP?')) return;
  await fetch(API_BASE + '/admin/mailing/smtp', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } });
  await loadMailing();
}

async function copyMailText(){ try { await navigator.clipboard.writeText(window._mailPreviewText || ''); mailingMsg('<span class="ok">✅ Tekst skopiowany do schowka.</span>'); } catch(e){ const t = document.getElementById('mailText'); if (t) { t.select(); document.execCommand('copy'); } } }
async function copyMailHtml(){ try { await navigator.clipboard.writeText(window._mailPreviewHtml || ''); mailingMsg('<span class="ok">✅ HTML skopiowany do schowka.</span>'); } catch(e){ mailingMsg('<span class="bad">Nie udało się skopiować — użyj „Pobierz .html”.</span>'); } }
function downloadMailHtml(id){
  const blob = new Blob([window._mailPreviewHtml || ''], { type: 'text/html' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'finderdom-mail-' + id + '.html'; a.click();
}
async function testMailing(id){
  mailingMsg('⏳ Wysyłam test na Twój adres…');
  try { const r = await apiPost('/admin/mailing/test', { template: id }); await loadMailing(); mailingMsg(`<span class="ok">✅ Wysłano test na ${escapeHtml(r.to)} — sprawdź skrzynkę (także spam).</span>`); }
  catch(e){ mailingMsg(`<span class="bad">Błąd: ${escapeHtml(e.message)}</span>`); }
}

document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'stripeForm') return;
  e.preventDefault();
  const key = document.getElementById('stripeKey').value.trim();
  const msg = document.getElementById('stripeMsg'); const btn = document.getElementById('stripeSaveBtn');
  if (!key) { msg.innerHTML = '<span class="bad">Wklej klucz.</span>'; return; }
  btn.disabled = true; msg.innerHTML = '⏳ Sprawdzam klucz w Stripe i tworzę webhook…';
  try {
    const r = await fetch(API_BASE + '/admin/stripe', { method: 'POST', headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }, body: JSON.stringify({ secret_key: key }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
    renderStripe(d); document.getElementById('stripeKey').value = '';
    msg.innerHTML = '<span class="ok">✅ Gotowe — Stripe podłączony, webhook utworzony. Zrób testową płatność na stronie wyceny.</span>';
  } catch(err) { msg.innerHTML = `<span class="bad">❌ ${escapeHtml(err.message)}</span>`; }
  finally { btn.disabled = false; }
});

async function loadScrapers(){
  try {
    const d = await api('/admin/scraper-status');
    document.getElementById('scrapersCount').textContent = `${d.total_groups} grup (miasto+typ)`;
    if (!d.items.length) {
      setHtml('scrapersTable', '<div class="empty">Brak zeskrapowanych ofert w bazie</div>');
      return;
    }
    // Sort by count desc
    d.items.sort((a,b) => b.count - a.count);
    const rows = d.items.slice(0, 200).map(s => {
      const lastDt = s.last_scraped ? new Date(s.last_scraped) : null;
      const hoursAgo = lastDt ? Math.floor((Date.now() - lastDt.getTime()) / 3600000) : null;
      const staleClass = hoursAgo != null && hoursAgo > 24 ? 'style="color:#fb7185"' : hoursAgo != null && hoursAgo > 12 ? 'style="color:#FFB800"' : 'style="color:#4ade80"';
      return `
        <tr>
          <td><strong>${escapeHtml(s.city || '?')}</strong></td>
          <td>${escapeHtml(s.type || '?')}</td>
          <td style="color:#FFB800;font-weight:800">${s.count.toLocaleString('pl-PL')}</td>
          <td>${s.portals ? s.portals.map(p => `<span class="tag tag-free" style="margin-right:4px">${escapeHtml(p)}</span>`).join('') : '—'}</td>
          <td ${staleClass}>${fmtDate(s.last_scraped)}${hoursAgo != null ? ` (${hoursAgo}h temu)` : ''}</td>
        </tr>
      `;
    }).join('');
    setHtml('scrapersTable', `
      <table>
        <thead><tr>
          <th>Miasto</th><th>Typ</th><th>Ofert</th><th>Portale</th><th>Ostatni scrape</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `);
  } catch(e){
    setHtml('scrapersTable', `<div class="err">Błąd: ${escapeHtml(e.message)}</div>`);
  }
}

// ── Init ──
(async function init(){
  if (!getToken()) { renderLogin('Musisz być zalogowany na konto admina, aby zobaczyć ten panel.'); return; }
  try {
    // Verify token AND admin access
    await api('/admin/stats');
  } catch(e){
    if (e.message === 'NOT_ADMIN') { renderLogin('Twoje konto nie ma uprawnień administratora. Zaloguj się jako admin.'); return; }
    if (e.message === 'SESSION_EXPIRED' || e.message === 'AUTH_REQUIRED') { renderLogin('Sesja wygasła. Zaloguj się ponownie.'); return; }
    // For other errors — allow render, will show error in the panels
  }
  // Render dashboard
  const tpl = document.getElementById('tpl-dashboard').content.cloneNode(true);
  document.getElementById('main').innerHTML = '';
  document.getElementById('main').appendChild(tpl);
  // Show admin email
  try {
    const u = JSON.parse(localStorage.getItem('finderdom_user') || '{}');
    document.getElementById('adminEmail').textContent = u.email || '—';
  } catch(e){}
  initTabs();
  loadStats();
  loadTimeseries();
})();
</script>
