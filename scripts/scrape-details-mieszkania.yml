name: Scrape Otodom Details — MIESZKANIA (ScrapingBee)

# WORKFLOW: enrichment mieszkań przez ScrapingBee (osobno od domów, żeby nie mieszać budżetów).
# Domy używają scrape-details.yml (ZenRows/ScraperAPI), mieszkania — tego workflow (BEE).
#
# ScrapingBee Starter ($49/mo) = 250 000 credits
# Otodom detail (premium + JS) = ~25 credits
# → ~10 000 mieszkań/mo, wszystkie 14 642 obrobi w ~5 dni CRONem co 4h.

on:
  workflow_dispatch:
    inputs:
      detail_max:
        description: "Górny limit ofert do enrichmentu (i tak zatrzyma się na MAX_RUN_TIME)."
        required: true
        default: "10000"
        type: string
  # Odkomentuj po pierwszym udanym uruchomieniu ręcznym:
  # schedule:
  #   - cron: "20 */4 * * *"   # co 4h o :20 (przesunięte 10 min względem scrape-details.yml)

permissions:
  contents: write

concurrency:
  group: scraper-details-mieszkania-${{ github.ref }}
  cancel-in-progress: true

jobs:
  details:
    name: Scrape Otodom Details (mieszkania) → wzbogać data/listings.json
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run details fetch (mieszkania via ScrapingBee)
        env:
          DETAILS_ONLY: "1"
          DETAIL_MAX: ${{ github.event.inputs.detail_max || '10000' }}
          DETAIL_WORKERS: "3"
          DETAIL_DELAY: "0.5"
          MAX_RUN_TIME: "9000"
          # Tylko mieszkania — ten workflow zajmuje się MIESZKANIAMI
          DETAIL_ONLY_TYPE: "mieszkanie"
          # Pomijaj już wzbogacone (kluczowe dla CRON)
          SKIP_ENRICHED: "1"
          # 🐝 ScrapingBee — provider dla mieszkań (osobny budżet niż domy/ZenRows)
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGBEE_PREMIUM: "1"
          SCRAPINGBEE_RENDER_JS: "1"
          SCRAPINGBEE_COUNTRY: "pl"
        run: |
          python scripts/otodom_scraper.py

      - name: Show summary
        if: always()
        run: |
          if [ -f data/listings.json ]; then
            python -c "import json; d=json.load(open('data/listings.json')); print('count:', d.get('count')); print('details_enriched:', d.get('details_enriched')); print('details_enriched_this_run:', d.get('details_enriched_this_run'))"
            echo "size: $(du -h data/listings.json | cut -f1)"
          fi

      - name: Commit & push enriched listings
        run: |
          if git diff --quiet data/listings.json; then
            echo "Brak zmian - nie commituje."
            exit 0
          fi
          git config user.name  "FinderDom Bot"
          git config user.email "bot@finderdom.pl"
          git add data/listings.json
          ENRICHED=$(python -c "import json; d=json.load(open('data/listings.json')); print(d.get('details_enriched', 0))")
          THIS_RUN=$(python -c "import json; d=json.load(open('data/listings.json')); print(d.get('details_enriched_this_run', 0))")
          git commit -m "chore(data): enrich mieszkania (BEE) - +${THIS_RUN} (total ${ENRICHED}) [skip ci]"
          git push
