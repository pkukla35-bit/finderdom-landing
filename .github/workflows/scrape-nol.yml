name: NOL — nieruchomosci-online.pl bezpośrednio (pn–pt, 0 zł)

# Własny scraper nieruchomosci-online.pl — bez Apify/ScrapingBee, bez proxy (strony są renderowane serwerowo).
# Codziennie pobiera tylko NOWE ogłoszenia (lista sortowana od najnowszych), dla nowych ściąga szczegóły
# (opis, telefon, zdjęcia, współrzędne, typ ogłoszeniodawcy).

on:
  schedule:
    - cron: '0 7 * * 1-5'   # 08:00/09:00 PL, pn–pt
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Stron listy na miasto (38 ofert/strona)"
        default: "6"
      max_details:
        description: "Max szczegółów ofert na job"
        default: "1500"
      city:
        description: "Jedno miasto (slug, np. krakow) — puste = 20 miast"
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - property: mieszkanie
            transaction: sprzedaz
          - property: dom
            transaction: sprzedaz
          - property: dzialka
            transaction: sprzedaz
          - property: mieszkanie
            transaction: wynajem
          - property: dom
            transaction: wynajem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Scrape ${{ matrix.transaction }} / ${{ matrix.property }}
        run: |
          python scripts/scrape_nol.py \
            --property "${{ matrix.property }}" \
            --transaction "${{ matrix.transaction }}" \
            --max-pages "${{ github.event.inputs.max_pages || '6' }}" \
            --max-details "${{ github.event.inputs.max_details || '1500' }}" \
            ${{ github.event.inputs.city && format('--city "{0}"', github.event.inputs.city) || '' }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
