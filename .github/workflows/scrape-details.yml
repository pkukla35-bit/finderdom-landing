name: Scrape Otodom Details (Phase 2)

on:
  workflow_dispatch:
    inputs:
      detail_max:
        description: "Ile ofert dostanie szczegoly"
        required: true
        default: "15000"
        type: string

permissions:
  contents: write

concurrency:
  group: scraper-details-${{ github.ref }}
  cancel-in-progress: true

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Run details fetch
        env:
          DETAILS_ONLY: "1"
          DETAIL_MAX: ${{ github.event.inputs.detail_max || '15000' }}
          DETAIL_WORKERS: "4"
          DETAIL_DELAY: "0.4"
          DETAIL_ONLY_TYPE: "dom"
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          ZENROWS_ANTIBOT: "1"
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_API_PREMIUM: "1"
          SCRAPER_API_COUNTRY: "pl"
        run: python scripts/otodom_scraper.py
      - name: Show summary
        if: always()
        run: |
          if [ -f data/listings.json ]; then
            python -c "import json; d=json.load(open('data/listings.json')); print('count:', d.get('count')); print('enriched:', d.get('details_enriched'))"
            du -h data/listings.json
          fi
      - name: Commit and push
        run: |
          if git diff --quiet data/listings.json; then
            echo "Brak zmian"
            exit 0
          fi
          git config user.name "FinderDom Bot"
          git config user.email "bot@finderdom.pl"
          git add data/listings.json
          git commit -m "chore(data): enrich Otodom details"
          git push
