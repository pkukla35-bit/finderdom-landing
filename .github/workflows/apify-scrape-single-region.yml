name: Apify scrape SINGLE region (multi property)

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Województwo (jedno)'
        required: true
        type: choice
        options:
          - dolnośląskie
          - kujawsko-pomorskie
          - lubelskie
          - lubuskie
          - łódzkie
          - małopolskie
          - mazowieckie
          - opolskie
          - podkarpackie
          - podlaskie
          - pomorskie
          - śląskie
          - świętokrzyskie
          - warmińsko-mazurskie
          - wielkopolskie
          - zachodniopomorskie
        default: mazowieckie
      properties:
        description: 'Typy nieruchomości (CSV: mieszkanie,dom / dzialka / lokal / all)'
        required: true
        type: string
        default: 'mieszkanie,dom'
      max_items_per_portal:
        description: 'Max ofert per portal per typ (dla dużych województw daj 1500)'
        required: false
        type: string
        default: '1500'
      score_threshold:
        description: 'Confidence cutoff (0-100)'
        required: false
        type: string
        default: '85'
      days:
        description: 'Ostatnie N dni'
        required: false
        type: string
        default: '30'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_from: ${{ steps.d.outputs.date_from }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: d
        run: |
          DAYS="${{ inputs.days }}"
          DATE_FROM=$(date -u -d "$DAYS days ago" +%Y-%m-%d)
          echo "date_from=$DATE_FROM" >> $GITHUB_OUTPUT
          echo "📅 dateFrom=$DATE_FROM"
      - id: m
        run: |
          RAW="${{ inputs.properties }}"
          if [ "$RAW" = "all" ]; then
            RAW="mieszkanie,dom,dzialka,lokal"
          fi
          # Konwersja CSV -> JSON array
          JSON=$(python3 -c "import sys,json; print(json.dumps([x.strip() for x in '$RAW'.split(',') if x.strip()]))")
          echo "matrix=$JSON" >> $GITHUB_OUTPUT
          echo "🧮 property matrix=$JSON"

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        property: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pymongo requests
      - name: Odpal Apify actor
        id: run_actor
        run: |
          DATE_FROM="${{ needs.prepare.outputs.date_from }}"
          REGION="${{ inputs.region }}"
          PROP="${{ matrix.property }}"
          echo "🗺️ [$REGION / $PROP] dateFrom=$DATE_FROM"
          RESP=$(curl -s -X POST "https://api.apify.com/v2/acts/trev0n~polish-real-estate-aggregator/runs?token=${{ secrets.APIFY_TOKEN }}&memory=4096&timeout=5400" \
            -H "Content-Type: application/json" \
            -d "{
              \"city\": \"$REGION\",
              \"propertyType\": \"$PROP\",
              \"searchType\": \"sprzedaz\",
              \"maxItemsPerPortal\": ${{ inputs.max_items_per_portal }},
              \"sellerType\": \"all\",
              \"scoreThreshold\": ${{ inputs.score_threshold }},
              \"portals\": [\"otodom\",\"morizon\",\"gratka\",\"olx\",\"nol\",\"adresowo\",\"domiporta\"],
              \"dateFrom\": \"$DATE_FROM\",
              \"dateBasis\": \"created\",
              \"undatedListings\": \"drop\",
              \"otodomProxy\": {\"useApifyProxy\": true, \"apifyProxyGroups\": [\"RESIDENTIAL\"], \"apifyProxyCountry\": \"PL\"}
            }")
          echo "$RESP" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print('ACTOR RESPONSE:', json.dumps(d, indent=2)[:500])"
          RUN_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['id'])")
          DATASET_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['defaultDatasetId'])")
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "dataset_id=$DATASET_ID" >> $GITHUB_OUTPUT
          echo "🚀 [$REGION / $PROP] Run: $RUN_ID  Dataset: $DATASET_ID"
      - name: Poczekaj na koniec Apify (max ~90 min)
        run: |
          STATUS="UNKNOWN"
          for i in $(seq 1 270); do
            STATUS=$(curl -s "https://api.apify.com/v2/actor-runs/${{ steps.run_actor.outputs.run_id }}?token=${{ secrets.APIFY_TOKEN }}" \
              | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['status'])" 2>/dev/null || echo "PARSE_ERR")
            echo "  [${{ inputs.region }} / ${{ matrix.property }}] status: $STATUS (iter $i / 270)"
            case "$STATUS" in
              SUCCEEDED|FAILED|ABORTED|TIMED-OUT|TIMEOUT) break ;;
            esac
            sleep 20
          done
          if [ "$STATUS" != "SUCCEEDED" ]; then
            echo "❌ [${{ inputs.region }} / ${{ matrix.property }}] $STATUS"
            exit 1
          fi
      - name: Import do MongoDB
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
        run: |
          python scripts/import_apify.py --dataset-id ${{ steps.run_actor.outputs.dataset_id }} --property ${{ matrix.property }}
