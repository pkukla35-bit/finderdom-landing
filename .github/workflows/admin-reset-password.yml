name: Admin – reset hasła użytkownika

# Ręczne ustawienie nowego hasła dla istniejącego konta.
# Podaje się GOTOWY hash bcrypt (nie hasło), więc w logach/inputach nie ma plaintextu.
# Hash lokalnie: python3 -c "import bcrypt;print(bcrypt.hashpw(b'NOWE_HASLO', bcrypt.gensalt()).decode())"

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'E-mail konta'
        required: true
      password_hash:
        description: 'Hash bcrypt nowego hasła ($2b$...)'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pymongo
      - name: Ustaw hash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          EMAIL: ${{ inputs.email }}
          PW_HASH: ${{ inputs.password_hash }}
        run: |
          python3 - <<'EOF'
          import os
          from pymongo import MongoClient
          db = MongoClient(os.environ['MONGODB_URI'])[os.environ.get('MONGODB_DB', 'finderdom')]
          email = os.environ['EMAIL'].strip().lower()
          h = os.environ['PW_HASH'].strip()
          assert h.startswith('$2'), 'to nie jest hash bcrypt'
          r = db.users.update_one({'email': email}, {'$set': {'password_hash': h}})
          print(f'matched={r.matched_count} modified={r.modified_count}')
          if r.matched_count == 0:
              raise SystemExit('Brak użytkownika o tym e-mailu')
          EOF
