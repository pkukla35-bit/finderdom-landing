name: Apify CRON - HOT cities (co 1h)

# Scrape'uje TOP 10 najbardziej ruchliwych miast co godzinę - świeże oferty <7d
# Pełny scrape 30-day zostawiamy dla apify-scrape-by-region (manual/6h)

on:
  schedule:
    # Co 3 godziny (zamiast co 1h — oszczędzamy Apify budget)
    - cron: '15 */3 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Max ofert per portal per miasto'
        required: false
        type: string
        default: '100'
      days:
        description: 'Ostatnie N dni'
        required: false
        type: string
        default: '3'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_from: ${{ steps.d.outputs.date_from }}
    steps:
      - id: d
        run: |
          DAYS="${{ inputs.days || '7' }}"
          DATE_FROM=$(date -u -d "$DAYS days ago" +%Y-%m-%d)
          echo "date_from=$DATE_FROM" >> $GITHUB_OUTPUT
          echo "📅 hot-cities dateFrom=$DATE_FROM"

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        city: [Warszawa, Kraków, Wrocław, Poznań, Gdańsk]
        property: [mieszkanie, dom]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pymongo requests
      - name: Odpal Apify actor
        id: run_actor
        run: |
          DATE_FROM="${{ needs.prepare.outputs.date_from }}"
          MAX="${{ inputs.max_items || '100' }}"
          CITY="${{ matrix.city }}"
          PROP="${{ matrix.property }}"
          echo "🔥 [$CITY / $PROP] fresh <7d, max=$MAX"
          RESP=$(curl -s -X POST "https://api.apify.com/v2/acts/trev0n~polish-real-estate-aggregator/runs?token=${{ secrets.APIFY_TOKEN }}&memory=2048&timeout=2400" \
            -H "Content-Type: application/json" \
            -d "{
              \"city\": \"$CITY\",
              \"propertyType\": \"$PROP\",
              \"searchType\": \"sprzedaz\",
              \"maxItemsPerPortal\": $MAX,
              \"sellerType\": \"all\",
              \"scoreThreshold\": 85,
              \"portals\": [\"otodom\",\"morizon\",\"gratka\",\"olx\",\"domiporta\"],
              \"dateFrom\": \"$DATE_FROM\",
              \"dateBasis\": \"created\",
              \"undatedListings\": \"drop\",
              \"otodomProxy\": {\"useApifyProxy\": true, \"apifyProxyGroups\": [\"RESIDENTIAL\"], \"apifyProxyCountry\": \"PL\"}
            }")
          RUN_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['id'])" 2>/dev/null || echo "")
          DATASET_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['defaultDatasetId'])" 2>/dev/null || echo "")
          if [ -z "$RUN_ID" ]; then
            echo "❌ Actor start failed. Response: $RESP"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "dataset_id=$DATASET_ID" >> $GITHUB_OUTPUT
          echo "🚀 [$CITY/$PROP] Run: $RUN_ID"
      - name: Poczekaj (max 40 min)
        run: |
          STATUS="UNKNOWN"
          for i in $(seq 1 120); do
            STATUS=$(curl -s "https://api.apify.com/v2/actor-runs/${{ steps.run_actor.outputs.run_id }}?token=${{ secrets.APIFY_TOKEN }}" \
              | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['status'])" 2>/dev/null || echo "PARSE_ERR")
            echo "  [${{ matrix.city }}/${{ matrix.property }}] $STATUS (iter $i/120)"
            case "$STATUS" in
              SUCCEEDED|FAILED|ABORTED|TIMED-OUT|TIMEOUT) break ;;
            esac
            sleep 20
          done
          if [ "$STATUS" != "SUCCEEDED" ]; then
            echo "⚠️ [${{ matrix.city }}/${{ matrix.property }}] $STATUS — pomijamy import"
            exit 0
          fi
      - name: Import do MongoDB
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
        run: |
          python scripts/import_apify.py --dataset-id ${{ steps.run_actor.outputs.dataset_id }} --property ${{ matrix.property }}

  cleanup:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pymongo
      - name: Usuń oferty > 30 dni (rolling window)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
        run: |
          python3 <<'EOF'
          import os
          from datetime import datetime, timezone, timedelta
          from pymongo import MongoClient
          client = MongoClient(os.environ['MONGODB_URI'])
          db = client[os.environ.get('MONGODB_DB', 'finderdom')]
          cutoff = (datetime.now(timezone.utc) - timedelta(days=30)).isoformat()
          r = db.listings.delete_many({'scraped_via': 'apify', 'added_at': {'$lt': cutoff}})
          print(f'🧹 Usunięto {r.deleted_count} ofert Apify starszych niż 30 dni')
          EOF
