name: Apify scrape by region (16 województw)

on:
  workflow_dispatch:
    inputs:
      property:
        description: 'Typ nieruchomosci'
        required: true
        type: choice
        options:
          - dzialka
          - dom
          - mieszkanie
          - lokal
        default: dzialka
      max_items_per_portal:
        description: 'Max ofert per portal per wojewodztwo'
        required: false
        type: string
        default: '1000'
      score_threshold:
        description: 'Confidence cutoff (0-100)'
        required: false
        type: string
        default: '85'
      days:
        description: 'Ostatnie N dni'
        required: false
        type: string
        default: '30'

jobs:
  compute-date:
    runs-on: ubuntu-latest
    outputs:
      date_from: ${{ steps.d.outputs.date_from }}
    steps:
      - id: d
        run: |
          DAYS="${{ inputs.days }}"
          DATE_FROM=$(date -u -d "$DAYS days ago" +%Y-%m-%d)
          echo "date_from=$DATE_FROM" >> $GITHUB_OUTPUT

  scrape:
    needs: compute-date
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region:
          - dolnośląskie
          - kujawsko-pomorskie
          - lubelskie
          - lubuskie
          - łódzkie
          - małopolskie
          - mazowieckie
          - opolskie
          - podkarpackie
          - podlaskie
          - pomorskie
          - śląskie
          - świętokrzyskie
          - warmińsko-mazurskie
          - wielkopolskie
          - zachodniopomorskie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymongo requests
      - name: Odpal Apify actor
        id: run_actor
        run: |
          DATE_FROM="${{ needs.compute-date.outputs.date_from }}"
          echo "🗺️ [${{ matrix.region }}] dateFrom=$DATE_FROM"
          RESP=$(curl -s -X POST "https://api.apify.com/v2/acts/trev0n~polish-real-estate-aggregator/runs?token=${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"city\": \"${{ matrix.region }}\",
              \"propertyType\": \"${{ inputs.property }}\",
              \"searchType\": \"sprzedaz\",
              \"maxItemsPerPortal\": ${{ inputs.max_items_per_portal }},
              \"sellerType\": \"all\",
              \"scoreThreshold\": ${{ inputs.score_threshold }},
              \"portals\": [\"otodom\",\"morizon\",\"gratka\",\"olx\",\"nol\",\"adresowo\",\"domiporta\"],
              \"dateFrom\": \"$DATE_FROM\",
              \"dateBasis\": \"created\",
              \"undatedListings\": \"drop\",
              \"otodomProxy\": {\"useApifyProxy\": true, \"apifyProxyGroups\": [\"RESIDENTIAL\"], \"apifyProxyCountry\": \"PL\"}
            }")
          RUN_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['id'])")
          DATASET_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['defaultDatasetId'])")
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "dataset_id=$DATASET_ID" >> $GITHUB_OUTPUT
          echo "🚀 [${{ matrix.region }}] Run: $RUN_ID"
      - name: Poczekaj na koniec
        run: |
          STATUS="UNKNOWN"
          for i in $(seq 1 180); do
            STATUS=$(curl -s "https://api.apify.com/v2/actor-runs/${{ steps.run_actor.outputs.run_id }}?token=${{ secrets.APIFY_TOKEN }}" \
              | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['status'])" 2>/dev/null || echo "PARSE_ERR")
            echo "  [${{ matrix.region }}] status: $STATUS (iter $i)"
            case "$STATUS" in
              SUCCEEDED|FAILED|ABORTED|TIMED-OUT|TIMEOUT) break ;;
            esac
            sleep 20
          done
          if [ "$STATUS" != "SUCCEEDED" ]; then
            echo "❌ [${{ matrix.region }}] $STATUS"
            exit 1
          fi
      - name: Import
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
        run: |
          python scripts/import_apify.py --dataset-id ${{ steps.run_actor.outputs.dataset_id }} --property ${{ inputs.property }}
