name: RCN — ceny transakcyjne (GUGiK WFS → MongoDB)

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Tylko jedno miasto (np. Kraków). Puste = wszystkie ~196 miast z city-coords.js'
        required: false
        type: string
        default: ''
      since:
        description: 'Transakcje od daty (YYYY-MM-DD)'
        required: false
        type: string
        default: '2025-01-01'
      layers:
        description: 'Warstwy: lokale,dzialki'
        required: false
        type: string
        default: 'lokale,dzialki'
      limit_cities:
        description: 'Ogranicz do N pierwszych miast (0 = wszystkie)'
        required: false
        type: string
        default: '0'
  schedule:
    # 1. i 15. dnia miesiąca o 04:30 UTC — RCN odświeża się co ~2 tyg.; sync jest idempotentny (upsert po gid)
    - cron: '30 4 1,15 * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'
      - run: pip install -r scripts/requirements.txt
      - name: Sync RCN
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
        run: |
          ARGS="--since ${{ inputs.since || '2025-01-01' }} --layers ${{ inputs.layers || 'lokale,dzialki' }}"
          if [ -n "${{ inputs.city }}" ]; then ARGS="$ARGS --city '${{ inputs.city }}'"; fi
          if [ "${{ inputs.limit_cities || '0' }}" != "0" ]; then ARGS="$ARGS --limit-cities ${{ inputs.limit_cities }}"; fi
          echo "python scripts/rcn_sync.py $ARGS"
          eval python scripts/rcn_sync.py $ARGS
