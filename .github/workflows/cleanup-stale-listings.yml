name: Cleanup stale listings (auto-remove 404/410 offers)

on:
  schedule:
    # Codziennie o 3:00 UTC (5:00 CEST) — mała ruch, tania operacja
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (nic nie zmienia w bazie)'
        required: false
        type: choice
        options: ['no', 'yes']
        default: 'no'
      batches:
        description: 'Ile bathe po 200 ofert (default 5 = 1000 sprawdzen)'
        required: false
        default: '5'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sprawdz oferty (HEAD-check URLi)
        env:
          API_BASE: ${{ secrets.API_BASE || 'https://www.finderdom.pl' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FD_ADMIN_EMAIL: ${{ secrets.FD_ADMIN_EMAIL }}
          FD_ADMIN_PASSWORD: ${{ secrets.FD_ADMIN_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run || 'no' }}
          BATCHES: ${{ inputs.batches || '5' }}
        run: |
          set -e
          # Autoryzacja: X-Cron-Secret (jeśli ustawione) LUB token admina z logowania (FD_ADMIN_EMAIL/FD_ADMIN_PASSWORD)
          AUTH_H="X-Cron-Secret: ${CRON_SECRET}"
          if [ -z "$CRON_SECRET" ]; then
            if [ -z "$FD_ADMIN_EMAIL" ] || [ -z "$FD_ADMIN_PASSWORD" ]; then
              echo "ERROR: brak CRON_SECRET oraz FD_ADMIN_EMAIL/FD_ADMIN_PASSWORD w GitHub Secrets"
              exit 1
            fi
            TOKEN=$(curl -sS -X POST "${API_BASE}/api/auth/login" -H "Content-Type: application/json" \
              -d "{\"email\":\"${FD_ADMIN_EMAIL}\",\"password\":\"${FD_ADMIN_PASSWORD}\"}" --max-time 30 \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
            if [ -z "$TOKEN" ]; then echo "ERROR: logowanie admina nie powiodło się"; exit 1; fi
            AUTH_H="Authorization: Bearer ${TOKEN}"
            echo "Autoryzacja: token admina"
          fi

          DRY=0
          if [ "$DRY_RUN" = "yes" ]; then DRY=1; fi

          TOTAL_CHECKED=0
          TOTAL_STALE=0
          TOTAL_DELETED=0

          for i in $(seq 1 $BATCHES); do
            echo "--- Batch $i/$BATCHES ---"
            RESP=$(curl -sS -X POST \
              "${API_BASE}/api/admin/cleanup-stale?limit=200&concurrency=20&dry_run=${DRY}" \
              -H "$AUTH_H" \
              -H "Content-Type: application/json" \
              --max-time 60)
            echo "Response: $RESP"

            CHECKED=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('checked',0))")
            STALE=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('marked_stale',0))")
            DEL=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('deleted_permanent',0))")

            TOTAL_CHECKED=$((TOTAL_CHECKED + CHECKED))
            TOTAL_STALE=$((TOTAL_STALE + STALE))
            TOTAL_DELETED=$((TOTAL_DELETED + DEL))

            if [ "$CHECKED" = "0" ]; then
              echo "Brak wiecej ofert do sprawdzenia — koncze."
              break
            fi
            sleep 3
          done

          echo ""
          echo "--- OLX: status przez API OLX (aktywne → świeże zdjęcia, zakończone → stale) ---"
          # Łagodnie: małe partie, niska równoległość, przerwy — OLX blokuje (403) przy kilkuset zapytaniach naraz.
          for i in 1 2 3 4 5 6; do
            R=$(curl -sS -X POST "${API_BASE}/api/admin/olx-image-sweep?limit=120&concurrency=3&dry_run=${DRY}" \
              -H "$AUTH_H" --max-time 120 || echo '{}')
            echo "OLX sweep $i: $R"
            REM=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('remaining',0))" 2>/dev/null || echo 0)
            ABORT=$(echo "$R" | python3 -c "import sys,json;print(1 if json.load(sys.stdin).get('aborted') else 0)" 2>/dev/null || echo 0)
            [ "$REM" = "0" ] && break
            [ "$ABORT" = "1" ] && { echo "OLX blokuje — przerywam na dziś"; break; }
            sleep 20
          done
          echo "--- OLX: przywracanie ofert błędnie oznaczonych (olx_image_404), które wciąż są aktywne ---"
          for i in 1 2 3 4 5 6; do
            R=$(curl -sS -X POST "${API_BASE}/api/admin/olx-image-sweep?limit=120&concurrency=3&revive=1&dry_run=${DRY}" \
              -H "$AUTH_H" --max-time 120 || echo '{}')
            echo "OLX revive $i: $R"
            REM=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('remaining',0))" 2>/dev/null || echo 0)
            ABORT=$(echo "$R" | python3 -c "import sys,json;print(1 if json.load(sys.stdin).get('aborted') else 0)" 2>/dev/null || echo 0)
            [ "$REM" = "0" ] && break
            [ "$ABORT" = "1" ] && { echo "OLX blokuje — przerywam na dziś"; break; }
            sleep 20
          done

          echo ""
          echo "======================================"
          echo "  PODSUMOWANIE (dry_run=$DRY_RUN)"
          echo "  Sprawdzono:   $TOTAL_CHECKED ofert"
          echo "  Oznaczono jako stale: $TOTAL_STALE"
          echo "  Skasowano permanentnie: $TOTAL_DELETED"
          echo "======================================"
