<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wycena gotowa — FinderDom.pl</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0B1836;color:#fff;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .bg-orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.35}
  .orb1{width:500px;height:500px;background:#22C55E;top:-100px;left:-100px}
  .orb2{width:400px;height:400px;background:#FFB800;bottom:-100px;right:-100px}
  .wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
  .card{width:100%;max-width:500px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:44px 32px;backdrop-filter:blur(10px);text-align:center}
  .icon{width:88px;height:88px;background:linear-gradient(135deg,#22C55E,#16A34A);border-radius:50%;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 8px 28px rgba(34,197,94,0.4);animation:pop 0.5s ease}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  h1{font-size:26px;font-weight:900;margin-bottom:10px;letter-spacing:-0.5px}
  .subtitle{color:#a3b3d1;font-size:15px;line-height:1.5;margin-bottom:26px}
  #status{color:#c5d0e6;font-size:14px;padding:14px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.1);border-radius:12px;margin-bottom:20px}
  #status.ok{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.4);color:#86efac}
  #status.err{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.4);color:#fca5a5}
  .btn{display:inline-block;padding:16px 36px;background:linear-gradient(135deg,#FFB800,#FFA200);color:#0B1836;border:none;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;transition:transform 0.15s ease;font-family:inherit;text-decoration:none;box-shadow:0 6px 20px rgba(255,184,0,0.35)}
  .btn:hover{transform:translateY(-1px)}
  .btn-ghost{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:#fff;box-shadow:none;padding:12px 20px;font-size:13px;margin-top:12px}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="wrap">
  <div class="card">
    <div class="icon">✓</div>
    <h1>Wycena gotowa!</h1>
    <p class="subtitle">Dziękujemy za zakup. Twój raport PDF jest gotowy do pobrania.</p>
    <div id="status"><span class="spinner"></span> Generuję Twoją wycenę...</div>
    <div id="actions" style="display:none">
      <button type="button" class="btn" id="dlBtn">📥 Pobierz PDF</button>
      <a href="/" class="btn btn-ghost">← Wróć do wyszukiwarki</a>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const sessionId = params.get('session_id');
  const statusEl = document.getElementById('status');
  const actionsEl = document.getElementById('actions');
  const dlBtn = document.getElementById('dlBtn');

  if (!sessionId){
    statusEl.className = 'err'; statusEl.textContent = 'Brak identyfikatora sesji.';
  } else {
    checkAndDownload();
  }

  async function checkAndDownload(){
    try {
      const r = await fetch('/api/valuation/download?session_id=' + encodeURIComponent(sessionId));
      if (r.status === 402){
        statusEl.innerHTML = '<span class="spinner"></span> Płatność jest weryfikowana...';
        setTimeout(checkAndDownload, 2500);
        return;
      }
      if (!r.ok){
        const err = await r.json().catch(() => ({detail:'Błąd'}));
        throw new Error(err.detail || 'Błąd generowania');
      }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);

      statusEl.className = 'ok';
      statusEl.innerHTML = '✓ Wycena wygenerowana. Pobieram automatycznie...';

      // Auto-download
      const dl = document.createElement('a');
      dl.href = url;
      dl.download = 'wycena-finderdom.pdf';
      dl.click();

      // Show manual button too
      dlBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = url; a.download = 'wycena-finderdom.pdf'; a.click();
      };
      actionsEl.style.display = 'block';
    } catch(e){
      statusEl.className = 'err';
      statusEl.textContent = '⚠️ ' + (e.message || 'Nieznany błąd');
    }
  }
</script>
</body>
</html>
