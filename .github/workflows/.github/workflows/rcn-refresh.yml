name: RCN — refresh transactional prices

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Import only one city (optional). Leave empty for all 20 cities.'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - Warszawa
          - Kraków
          - Wrocław
          - Łódź
          - Poznań
          - Gdańsk
          - Szczecin
          - Bydgoszcz
          - Lublin
          - Białystok
          - Katowice
          - Gdynia
          - Częstochowa
          - Radom
          - Toruń
          - Rzeszów
          - Kielce
          - Olsztyn
          - Zabrze
          - Sosnowiec
      since:
        description: 'Only import transactions since (YYYY-MM-DD). Empty = all.'
        required: false
        type: string
        default: '2023-01-01'
  schedule:
    - cron: '0 3 1 * *'

jobs:
  refresh:
    name: Refresh RCN
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Probe WFS layers (health check)
        run: python scripts/rcn_ingest.py --probe
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}

      - name: Ingest RCN data
        run: |
          ARGS=""
          if [ -n "${{ inputs.city }}" ]; then
            ARGS="$ARGS --city ${{ inputs.city }}"
          fi
          if [ -n "${{ inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ inputs.since }}"
          fi
          echo "Running: python scripts/rcn_ingest.py $ARGS"
          python scripts/rcn_ingest.py $ARGS
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}

      - name: Summary
        if: always()
        run: |
          echo "### RCN import complete" >> $GITHUB_STEP_SUMMARY
          echo "City: ${{ inputs.city || 'ALL (20 cities)' }}" >> $GITHUB_STEP_SUMMARY
          echo "Since: ${{ inputs.since || 'no date filter' }}" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
