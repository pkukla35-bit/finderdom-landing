name: Scrape Otodom Details (Phase 2)

# WORKFLOW #2: wzbogaca ISTNIEJĄCY data/listings.json o szczegóły (rynek, standard,
# typ budynku, balkon...) — uruchamiać PO głównym scrape-listings.yml.
#
# Zaleta: osobny scrape = nowa sesja HTTP = mniejsze ryzyko banu Otodom.

on:
  workflow_dispatch:
    inputs:
      detail_max:
        description: "Ile ofert dostanie szczegóły (10000-30000 = bezpiecznie)."
        required: true
        default: "15000"
        type: string

permissions:
  contents: write

concurrency:
  group: scraper-details-${{ github.ref }}
  cancel-in-progress: true

jobs:
  details:
    name: Scrape Otodom Details → wzbogać data/listings.json
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run details fetch
        env:
          DETAILS_ONLY: "1"
          DETAIL_MAX: ${{ github.event.inputs.detail_max || '15000' }}
          DETAIL_WORKERS: "4"
          DETAIL_DELAY: "0.4"
        run: |
          python scripts/otodom_scraper.py

      - name: Show summary
        if: always()
        run: |
          if [ -f data/listings.json ]; then
            python -c "import json; d=json.load(open('data/listings.json')); print('count:', d.get('count')); print('details_enriched:', d.get('details_enriched'))"
            echo "size: $(du -h data/listings.json | cut -f1)"
          fi

      - name: Commit & push enriched listings
        run: |
          if git diff --quiet data/listings.json; then
            echo "ℹ️  Brak zmian — nie commituję."
            exit 0
          fi
          git config user.name  "FinderDom Bot"
          git config user.email "bot@finderdom.pl"
          git add data/listings.json
          ENRICHED=$(python -c "import json; print(json.load(open('data/listings.json')).get('details_enriched', 0))")
          git commit -m "chore(data): enrich Otodom details — ${ENRICHED} enriched [skip ci]"
          git push
