<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Rezerwacja leada – FinderDom.pl</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏠%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#0b1220;color:#e6ecf7;min-height:100vh;display:flex;flex-direction:column;padding:20px}
  .header{max-width:640px;margin:0 auto 24px;width:100%}
  .logo{font-size:22px;font-weight:800;color:#FFB800;text-decoration:none}
  .card{max-width:640px;margin:0 auto;width:100%;background:linear-gradient(180deg,#111a2e,#0d1524);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:32px 28px;box-shadow:0 30px 60px rgba(0,0,0,0.35)}
  h1{font-size:24px;margin-bottom:12px;color:#fff}
  .subtitle{color:#c5d0e6;font-size:14px;margin-bottom:24px;line-height:1.6}
  .state{padding:20px;border-radius:14px;margin:16px 0}
  .state.loading{background:rgba(255,184,0,0.08);border:1px solid rgba(255,184,0,0.2);text-align:center}
  .state.success{background:linear-gradient(135deg,rgba(34,197,94,0.12),rgba(16,185,129,0.06));border:1px solid rgba(34,197,94,0.4)}
  .state.error{background:linear-gradient(135deg,rgba(239,68,68,0.12),rgba(220,38,38,0.06));border:1px solid rgba(239,68,68,0.4)}
  .state.warn{background:linear-gradient(135deg,rgba(251,191,36,0.12),rgba(245,158,11,0.06));border:1px solid rgba(251,191,36,0.4)}
  .big-phone{font-size:32px;font-weight:800;color:#FFB800;letter-spacing:1px;margin:12px 0;font-family:monospace}
  .btn{display:inline-block;padding:14px 28px;background:#FFB800;color:#0b1220;text-decoration:none;border-radius:12px;font-weight:700;border:none;cursor:pointer;font-size:15px;margin-top:16px}
  .btn:hover{background:#FFA000}
  .btn.ghost{background:transparent;color:#e6ecf7;border:1px solid rgba(255,255,255,0.2)}
  .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:14px}
  .info-row:last-child{border:none}
  .info-row span:first-child{color:#8ba3d4}
  .info-row span:last-child{color:#e6ecf7;font-weight:600}
  .spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,184,0,0.3);border-top-color:#FFB800;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="header">
    <a href="/" class="logo">🏠 FinderDom.pl</a>
  </div>
  <div class="card">
    <h1>🎯 Rezerwacja leada</h1>
    <p class="subtitle">FinderDom.pl Business — pierwszy który kliknie, wygrywa. Za chwilę spróbuję zarezerwować tego leada dla Twojego konta.</p>
    <div id="state" class="state loading">
      <span class="spinner"></span> <span style="margin-left:8px">Trwa rezerwacja...</span>
    </div>
    <div id="content"></div>
  </div>

<script>
(async function(){
  const stateEl = document.getElementById('state');
  const contentEl = document.getElementById('content');

  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  if (!token) {
    stateEl.className = 'state error';
    stateEl.innerHTML = '❌ Brak tokena. Otwórz link z emaila.';
    return;
  }

  // Check auth
  const jwt = localStorage.getItem('finderdom_token');
  if (!jwt) {
    stateEl.className = 'state warn';
    stateEl.innerHTML = '🔐 Musisz się zalogować, aby zarezerwować leada.';
    contentEl.innerHTML = '<a class="btn" href="/logowanie?next=' + encodeURIComponent(location.pathname + location.search) + '">Zaloguj się</a>';
    return;
  }

  try {
    const r = await fetch('/api/leads/claim?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + jwt },
    });
    const data = await r.json();

    if (r.ok && data.success) {
      const l = data.lead || {};
      const typeMap = {apartment:'Mieszkanie', house:'Dom', plot:'Działka'};
      const reasonMap = {ciekawosc:'Sprawdza z ciekawości', sprzedaz:'Chce sprzedać', agent:'Agent nieruchomości'};
      const areaTxt = l.area_m2 ? Math.round(l.area_m2) + ' m²' : '—';
      const locTxt = (l.city || '—') + (l.district ? ', ' + l.district : '');
      const phoneClean = (l.phone || '').replace(/\s+/g,'');
      const badge = data.already_yours ? '<div style="background:rgba(34,197,94,0.15);color:#22c55e;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;display:inline-block;margin-bottom:12px">✅ Ten lead jest już Twój</div>' : '<div style="background:rgba(34,197,94,0.15);color:#22c55e;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;display:inline-block;margin-bottom:12px">🎉 Zabookowany dla Ciebie!</div>';
      stateEl.className = 'state success';
      stateEl.innerHTML = badge +
        '<p style="color:#c5d0e6;font-size:13px;margin-bottom:16px">Zadzwoń do klienta jak najszybciej.</p>' +
        '<div class="big-phone">' + (l.phone || '—') + '</div>' +
        '<a class="btn" href="tel:' + phoneClean + '">📞 Zadzwoń teraz</a>';
      contentEl.innerHTML =
        '<div style="margin-top:20px">' +
        '<div class="info-row"><span>Email klienta</span><span>' + (l.email || '—') + '</span></div>' +
        '<div class="info-row"><span>Typ nieruchomości</span><span>' + (typeMap[l.type] || l.type || '—') + '</span></div>' +
        '<div class="info-row"><span>Lokalizacja</span><span>' + locTxt + '</span></div>' +
        '<div class="info-row"><span>Powierzchnia</span><span>' + areaTxt + '</span></div>' +
        '<div class="info-row"><span>Powód</span><span>' + (reasonMap[l.reason] || '—') + '</span></div>' +
        '</div>' +
        '<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost" href="/konto">📋 Moje konto</a></div>';
    } else if (r.status === 409) {
      stateEl.className = 'state warn';
      stateEl.innerHTML = '⏱️ ' + (data.detail || 'Ten lead został już zarezerwowany przez inne biuro.') +
        '<p style="color:#c5d0e6;font-size:13px;margin-top:12px">Zbyt późno — inny agent był pierwszy. Nowe leady pojawią się wkrótce!</p>';
      contentEl.innerHTML = '<a class="btn" href="/konto">📋 Moje konto</a>';
    } else if (r.status === 403) {
      stateEl.className = 'state error';
      stateEl.innerHTML = '🔒 Rezerwacja leadów dostępna tylko dla subskrypcji Firmowej (199 zł/mies).';
      contentEl.innerHTML = '<a class="btn" href="/konto">Aktywuj subskrypcję Firmową</a>';
    } else {
      stateEl.className = 'state error';
      stateEl.innerHTML = '❌ ' + (data.detail || 'Błąd rezerwacji.');
      contentEl.innerHTML = '<a class="btn" href="/konto">📋 Moje konto</a>';
    }
  } catch(err) {
    stateEl.className = 'state error';
    stateEl.innerHTML = '❌ Błąd sieci: ' + err.message;
  }
})();
</script>
</body>
</html>
