<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset hasła — FinderDom.pl</title>
<meta name="description" content="Ustaw nowe hasło do konta FinderDom.pl">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0B1836;color:#fff;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .bg-orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.35}
  .orb1{width:500px;height:500px;background:#FFB800;top:-100px;left:-100px}
  .orb2{width:400px;height:400px;background:#4A90E2;bottom:-100px;right:-100px}
  .wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px 60px}
  .header{display:flex;align-items:center;gap:12px;margin-bottom:40px}
  .logo-mini{width:44px;height:44px;background:linear-gradient(135deg,#1a2e5c 0%,#2d4a8a 100%);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
  .brand{font-size:18px;font-weight:900;letter-spacing:-0.5px}
  .brand .accent{color:#FFB800}
  .card{width:100%;max-width:440px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:36px 32px;backdrop-filter:blur(10px)}
  h1{font-size:28px;font-weight:900;letter-spacing:-0.5px;margin-bottom:8px}
  .subtitle{font-size:14px;color:#a3b3d1;margin-bottom:28px}
  .field{margin-bottom:16px}
  .label{display:block;font-size:12px;font-weight:800;color:#c5d0e6;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .input{width:100%;padding:14px 16px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#fff;font-size:15px;font-family:inherit;transition:border 0.2s ease}
  .input:focus{outline:none;border-color:#FFB800;background:rgba(0,0,0,0.35)}
  .input::placeholder{color:#5e6d8e}
  .btn-submit{width:100%;padding:16px;background:linear-gradient(135deg,#FFB800,#FFA200);color:#0B1836;border:none;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;transition:all 0.2s ease;margin-top:8px;font-family:inherit;letter-spacing:0.3px}
  .btn-submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,184,0,0.35)}
  .btn-submit:disabled{opacity:0.6;cursor:not-allowed}
  .alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
  .alert.show{display:block}
  .alert.error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#fca5a5}
  .alert.success{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);color:#86efac}
  .footer-link{text-align:center;margin-top:24px;font-size:14px;color:#a3b3d1}
  .footer-link a{color:#FFB800;font-weight:800}
  .footer-link a:hover{text-decoration:underline}
  .back{display:inline-flex;align-items:center;gap:6px;color:#a3b3d1;font-size:13px;margin-bottom:16px}
  .back:hover{color:#fff}
  @media (max-width:480px){ .card{padding:28px 22px} h1{font-size:24px} }
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
</div>

<div class="wrap">
  <a href="/" class="header">
    <div class="logo-mini">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#FFB800" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </div>
    <div class="brand">Finder<span class="accent">Dom</span>.pl</div>
  </a>

  <div class="card">
    <a href="/logowanie" class="back">← Logowanie</a>
    <h1 id="title">Nie pamiętasz hasła?</h1>
    <p class="subtitle" id="subtitle">Podaj e-mail konta — wyślemy link do ustawienia nowego hasła.</p>

    <div id="alert" class="alert"></div>

    <form id="requestForm" autocomplete="on" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" placeholder="twoj@email.pl" required autocomplete="email">
      </div>
      <button type="submit" class="btn-submit" id="requestBtn">Wyślij link</button>
    </form>

    <form id="resetForm" autocomplete="off" novalidate style="display:none">
      <div class="field">
        <label class="label" for="pw1">Nowe hasło (min. 8 znaków)</label>
        <input class="input" type="password" id="pw1" minlength="8" maxlength="72" required autocomplete="new-password">
      </div>
      <div class="field">
        <label class="label" for="pw2">Powtórz nowe hasło</label>
        <input class="input" type="password" id="pw2" minlength="8" maxlength="72" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-submit" id="resetBtn">Ustaw nowe hasło</button>
    </form>

    <div class="footer-link">
      Pamiętasz hasło? <a href="/logowanie">Zaloguj się</a>
    </div>
  </div>
</div>

<script>
  const alertBox = document.getElementById('alert');
  function showAlert(msg, type) { alertBox.textContent = msg; alertBox.className = 'alert show ' + type; }
  function hideAlert() { alertBox.className = 'alert'; }

  const token = new URLSearchParams(location.search).get('token');
  if (token) {
    document.getElementById('requestForm').style.display = 'none';
    document.getElementById('resetForm').style.display = '';
    document.getElementById('title').textContent = 'Ustaw nowe hasło';
    document.getElementById('subtitle').textContent = 'Wpisz nowe hasło do swojego konta FinderDom.';
  }

  document.getElementById('requestForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideAlert();
    const btn = document.getElementById('requestBtn');
    const email = document.getElementById('email').value.trim();
    if (!email) { showAlert('Podaj adres e-mail.', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Wysyłam...';
    try {
      const r = await fetch('/api/auth/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      if (!r.ok) throw new Error('Nie udało się wysłać wiadomości. Spróbuj ponownie.');
      showAlert('Jeśli konto istnieje, wysłaliśmy link na ' + email + '. Sprawdź też folder SPAM. Link jest ważny 1 godzinę.', 'success');
      btn.textContent = 'Wysłano';
    } catch (err) {
      showAlert(err.message, 'error');
      btn.disabled = false; btn.textContent = 'Wyślij link';
    }
  });

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideAlert();
    const btn = document.getElementById('resetBtn');
    const p1 = document.getElementById('pw1').value, p2 = document.getElementById('pw2').value;
    if (p1.length < 8) { showAlert('Hasło musi mieć min. 8 znaków.', 'error'); return; }
    if (p1 !== p2) { showAlert('Hasła nie są takie same.', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Zapisuję...';
    try {
      const r = await fetch('/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, new_password: p1 }) });
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || 'Nie udało się ustawić hasła.'); }
      localStorage.removeItem('finderdom_token'); localStorage.removeItem('finderdom_user');
      showAlert('Hasło ustawione! Przekierowuję do logowania...', 'success');
      setTimeout(() => { window.location.href = '/logowanie'; }, 1200);
    } catch (err) {
      showAlert(err.message, 'error');
      btn.disabled = false; btn.textContent = 'Ustaw nowe hasło';
    }
  });
</script>
</body>
</html>
