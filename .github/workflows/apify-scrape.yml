name: Apify scrape + import

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Miasto (np. Kraków)'
        required: true
        type: string
        default: 'Kraków'
      property:
        description: 'Typ nieruchomości'
        required: true
        type: choice
        options:
          - dzialka
          - dom
          - mieszkanie
        default: dzialka
      max_items:
        description: 'Max ofert (limit budżetu)'
        required: false
        type: string
        default: '500'
      actor:
        description: 'Aktor Apify'
        required: false
        type: choice
        options:
          - trev0n~polish-real-estate-aggregator
          - trev0n~otodom-scraper
        default: trev0n~polish-real-estate-aggregator

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pymongo requests
      - name: Odpal Apify actor
        id: run_actor
        run: |
          RESP=$(curl -s -X POST "https://api.apify.com/v2/acts/${{ inputs.actor }}/runs?token=${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "city": "${{ inputs.city }}",
              "propertyType": "${{ inputs.property }}",
              "searchType": "sprzedaz",
              "maxItems": ${{ inputs.max_items }}
            }')
          echo "Response: $RESP"
          RUN_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['id'])")
          DATASET_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['defaultDatasetId'])")
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "dataset_id=$DATASET_ID" >> $GITHUB_OUTPUT
          echo "🚀 Run started: $RUN_ID | Dataset: $DATASET_ID"
      - name: Poczekaj na zakonczenie
        run: |
          while true; do
            STATUS=$(curl -s "https://api.apify.com/v2/actor-runs/${{ steps.run_actor.outputs.run_id }}?token=${{ secrets.APIFY_TOKEN }}" \
              | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['status'])")
            echo "  status: $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ABORTED" ]; then break; fi
            sleep 15
          done
          if [ "$STATUS" != "SUCCEEDED" ]; then echo "❌ Run failed"; exit 1; fi
      - name: Import do MongoDB
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
        run: |
          python scripts/import_apify.py --dataset-id ${{ steps.run_actor.outputs.dataset_id }} --property ${{ inputs.property }}
