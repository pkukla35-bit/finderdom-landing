name: Apify CRON - Otodom regionalnie (działki/lokale/domy)

# Aggregator (trev0n/polish-real-estate-aggregator) przyjmuje tylko NAZWĘ MIASTA, więc dla
# całych województw Otodom zwraca ~0 ofert (zostają Gratka/Morizon). Ten workflow dociąga
# Otodom osobnym aktorem trev0n/otodom-scraper, który obsługuje ścieżkę województwa.
# Import przez scripts/import_apify.py --actor otodom (external_id = ID z URL → zgodne z aggregatorem).

on:
  schedule:
    - cron: '0 5 * * 1-5'   # pon–pt 05:00 UTC, po regionalnym cronie aggregatora (weekendy wyłączone)
  workflow_dispatch:
    inputs:
      regions:
        description: 'Województwa (slug Otodom, po przecinku) — puste = wszystkie 16'
        required: false
        type: string
        default: ''
      properties:
        description: 'Typy po przecinku: dzialka,lokal,dom,mieszkanie'
        required: false
        type: string
        default: 'dzialka,lokal,dom'
      posted_days:
        description: 'Ogłoszenia z ostatnich N dni (1/3/7/14)'
        required: false
        type: string
        default: '1'
      max_items:
        description: 'Max ofert na region+typ'
        required: false
        type: string
        default: '120'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.m.outputs.regions }}
      properties: ${{ steps.m.outputs.properties }}
    steps:
      - id: m
        run: |
          ALL='dolnoslaskie,kujawsko-pomorskie,lubelskie,lubuskie,lodzkie,malopolskie,mazowieckie,opolskie,podkarpackie,podlaskie,pomorskie,slaskie,swietokrzyskie,warminsko-mazurskie,wielkopolskie,zachodniopomorskie'
          R="${{ inputs.regions }}"; [ -z "$R" ] && R="$ALL"
          P="${{ inputs.properties }}"; [ -z "$P" ] && P="dzialka,lokal,dom"
          echo "regions=$(echo "$R" | python3 -c "import sys,json; print(json.dumps([x.strip() for x in sys.stdin.read().split(',') if x.strip()]))")" >> $GITHUB_OUTPUT
          echo "properties=$(echo "$P" | python3 -c "import sys,json; print(json.dumps([x.strip() for x in sys.stdin.read().split(',') if x.strip()]))")" >> $GITHUB_OUTPUT

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        region: ${{ fromJson(needs.prepare.outputs.regions) }}
        property: ${{ fromJson(needs.prepare.outputs.properties) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pymongo requests
      - name: Odpal Apify actor (otodom-scraper)
        id: run_actor
        run: |
          MAX="${{ inputs.max_items || '120' }}"
          DAYS="${{ inputs.posted_days || '1' }}"
          RESP=$(curl -s -X POST "https://api.apify.com/v2/acts/trev0n~otodom-scraper/runs?token=${{ secrets.APIFY_TOKEN }}&memory=2048&timeout=3000" \
            -H "Content-Type: application/json" \
            -d "{
              \"location\": \"${{ matrix.region }}\",
              \"propertyType\": \"${{ matrix.property }}\",
              \"searchType\": \"sprzedaz\",
              \"postedDate\": \"$DAYS\",
              \"maxItems\": $MAX,
              \"extractDetails\": true,
              \"maxConcurrency\": 10,
              \"proxyConfiguration\": {\"useApifyProxy\": true, \"apifyProxyGroups\": [\"RESIDENTIAL\"], \"apifyProxyCountry\": \"PL\"}
            }")
          RUN_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['id'])" 2>/dev/null || echo "")
          DATASET_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['defaultDatasetId'])" 2>/dev/null || echo "")
          if [ -z "$RUN_ID" ]; then
            echo "❌ Actor start failed. Response: $(echo "$RESP" | head -c 400)"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "dataset_id=$DATASET_ID" >> $GITHUB_OUTPUT
      - name: Poczekaj (max 50 min)
        run: |
          STATUS="UNKNOWN"
          for i in $(seq 1 150); do
            STATUS=$(curl -s "https://api.apify.com/v2/actor-runs/${{ steps.run_actor.outputs.run_id }}?token=${{ secrets.APIFY_TOKEN }}" \
              | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['status'])" 2>/dev/null || echo "PARSE_ERR")
            echo "  [${{ matrix.region }}/${{ matrix.property }}] $STATUS ($i/150)"
            case "$STATUS" in
              SUCCEEDED|FAILED|ABORTED|TIMED-OUT|TIMEOUT) break ;;
            esac
            sleep 20
          done
          if [ "$STATUS" != "SUCCEEDED" ]; then
            echo "⚠️ [${{ matrix.region }}/${{ matrix.property }}] $STATUS"
            exit 0
          fi
      - name: Import do MongoDB
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
        run: |
          python scripts/import_apify.py --dataset-id ${{ steps.run_actor.outputs.dataset_id }} --property ${{ matrix.property }} --actor otodom
