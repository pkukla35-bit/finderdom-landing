name: Apify scrape all Poland (parallel matrix)

on:
  workflow_dispatch:
    inputs:
      property:
        description: 'Typ nieruchomości'
        required: true
        type: choice
        options:
          - dzialka
          - dom
          - mieszkanie
          - lokal
        default: dzialka
      max_items_per_portal:
        description: 'Max ofert per portal per miasto'
        required: false
        type: string
        default: '500'
      score_threshold:
        description: 'Confidence cutoff (0-100) dla dedup'
        required: false
        type: string
        default: '85'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        city:
          - Warszawa
          - Kraków
          - Wrocław
          - Poznań
          - Gdańsk
          - Łódź
          - Szczecin
          - Bydgoszcz
          - Lublin
          - Katowice
          - Białystok
          - Gdynia
          - Częstochowa
          - Radom
          - Toruń
          - Kielce
          - Rzeszów
          - Olsztyn
          - Bielsko-Biała
          - Zielona Góra
          - Płock
          - Wałbrzych
          - Włocławek
          - Tarnów
          - Elbląg
          - Koszalin
          - Kalisz
          - Legnica
          - Grudziądz
          - Słupsk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymongo requests
      - name: Odpal Apify actor dla ${{ matrix.city }}
        id: run_actor
        run: |
          RESP=$(curl -s -X POST "https://api.apify.com/v2/acts/trev0n~polish-real-estate-aggregator/runs?token=${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "city": "${{ matrix.city }}",
              "propertyType": "${{ inputs.property }}",
              "searchType": "sprzedaz",
              "maxItemsPerPortal": ${{ inputs.max_items_per_portal }},
              "sellerType": "all",
              "scoreThreshold": ${{ inputs.score_threshold }},
              "portals": ["otodom","morizon","gratka","olx","nol","adresowo","domiporta"],
              "dateBasis": "created",
              "undatedListings": "keep",
              "otodomProxy": {"useApifyProxy": true, "apifyProxyGroups": ["RESIDENTIAL"], "apifyProxyCountry": "PL"}
            }')
          echo "Response: $RESP"
          RUN_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['id'])")
          DATASET_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['defaultDatasetId'])")
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "dataset_id=$DATASET_ID" >> $GITHUB_OUTPUT
          echo "🚀 [${{ matrix.city }}] Run: $RUN_ID | Dataset: $DATASET_ID"
      - name: Poczekaj na zakończenie
        run: |
          for i in {1..120}; do
            STATUS=$(curl -s "https://api.apify.com/v2/actor-runs/${{ steps.run_actor.outputs.run_id }}?token=${{ secrets.APIFY_TOKEN }}" \
              | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['status'])")
            echo "  [${{ matrix.city }}] status: $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ABORTED" ] || [ "$STATUS" = "TIMED-OUT" ]; then break; fi
            sleep 15
          done
          if [ "$STATUS" != "SUCCEEDED" ]; then echo "❌ [${{ matrix.city }}] Run failed"; exit 1; fi
      - name: Import do MongoDB
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
        run: |
          python scripts/import_apify.py --dataset-id ${{ steps.run_actor.outputs.dataset_id }} --property ${{ inputs.property }}
