name: Portale bezpośrednio — Morizon, Gratka, Domiporta, Adresowo (pn–pt, 0 zł)

# Własny scraper bez proxy (strony renderowane serwerowo). Tylko listy wyników (35–40 ofert / zapytanie).
# Sprzedaż: mieszkania, domy, działki. Wynajem: mieszkania, domy. 20 największych miast.

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 08:30/09:30 PL, pn–pt
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Stron listy na miasto"
        default: "5"
      city:
        description: "Jedno miasto (slug, np. krakow) — puste = 20 miast"
        default: ""
      portal:
        description: "Jeden portal (morizon/gratka/domiporta/adresowo) — puste = wszystkie"
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        portal: [morizon, gratka, domiporta, adresowo]
        include:
          - { property: mieszkanie, transaction: sprzedaz }
          - { property: dom,        transaction: sprzedaz }
          - { property: dzialka,    transaction: sprzedaz }
          - { property: mieszkanie, transaction: wynajem }
          - { property: dom,        transaction: wynajem }
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event.inputs.portal == '' || github.event.inputs.portal == matrix.portal }}
      - uses: actions/setup-python@v5
        if: ${{ github.event.inputs.portal == '' || github.event.inputs.portal == matrix.portal }}
        with:
          python-version: '3.11'
      - if: ${{ github.event.inputs.portal == '' || github.event.inputs.portal == matrix.portal }}
        run: pip install -r scripts/requirements.txt
      - name: ${{ matrix.portal }} ${{ matrix.transaction }}/${{ matrix.property }}
        if: ${{ github.event.inputs.portal == '' || github.event.inputs.portal == matrix.portal }}
        run: |
          python scripts/scrape_portals.py \
            --portal "${{ matrix.portal }}" \
            --property "${{ matrix.property }}" \
            --transaction "${{ matrix.transaction }}" \
            --max-pages "${{ github.event.inputs.max_pages || '5' }}" \
            ${{ github.event.inputs.city && format('--city "{0}"', github.event.inputs.city) || '' }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
