name: Apify CRON - regionalny scrape (co 6h)

# Odpala pełny scrape 16 województw dla mieszkań+domów co 6 godzin
# Dopełnia dane z hot-cities (które łapią tylko TOP 10 miast) o mniejsze miejscowości
# Rolling window: 30 dni

on:
  schedule:
    # Co 6 godzin: 03:30, 09:30, 15:30, 21:30 UTC (5:30, 11:30, 17:30, 23:30 CET)
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Max ofert per portal per województwo'
        required: false
        type: string
        default: '400'
      days:
        description: 'Ostatnie N dni (rolling window)'
        required: false
        type: string
        default: '30'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_from: ${{ steps.d.outputs.date_from }}
    steps:
      - id: d
        run: |
          DAYS="${{ inputs.days || '30' }}"
          DATE_FROM=$(date -u -d "$DAYS days ago" +%Y-%m-%d)
          echo "date_from=$DATE_FROM" >> $GITHUB_OUTPUT

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        region:
          - dolnośląskie
          - kujawsko-pomorskie
          - lubelskie
          - lubuskie
          - łódzkie
          - małopolskie
          - mazowieckie
          - opolskie
          - podkarpackie
          - podlaskie
          - pomorskie
          - śląskie
          - świętokrzyskie
          - warmińsko-mazurskie
          - wielkopolskie
          - zachodniopomorskie
        property: [mieszkanie, dom]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pymongo requests
      - name: Odpal Apify actor
        id: run_actor
        run: |
          DATE_FROM="${{ needs.prepare.outputs.date_from }}"
          MAX="${{ inputs.max_items || '400' }}"
          REG="${{ matrix.region }}"
          PROP="${{ matrix.property }}"
          RESP=$(curl -s -X POST "https://api.apify.com/v2/acts/trev0n~polish-real-estate-aggregator/runs?token=${{ secrets.APIFY_TOKEN }}&memory=4096&timeout=3600" \
            -H "Content-Type: application/json" \
            -d "{
              \"city\": \"$REG\",
              \"propertyType\": \"$PROP\",
              \"searchType\": \"sprzedaz\",
              \"maxItemsPerPortal\": $MAX,
              \"sellerType\": \"all\",
              \"scoreThreshold\": 85,
              \"portals\": [\"otodom\",\"morizon\",\"gratka\",\"olx\",\"domiporta\",\"adresowo\",\"nol\"],
              \"dateFrom\": \"$DATE_FROM\",
              \"dateBasis\": \"created\",
              \"undatedListings\": \"drop\",
              \"otodomProxy\": {\"useApifyProxy\": true, \"apifyProxyGroups\": [\"RESIDENTIAL\"], \"apifyProxyCountry\": \"PL\"}
            }")
          RUN_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['id'])" 2>/dev/null || echo "")
          DATASET_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['defaultDatasetId'])" 2>/dev/null || echo "")
          if [ -z "$RUN_ID" ]; then
            echo "❌ Actor start failed"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "dataset_id=$DATASET_ID" >> $GITHUB_OUTPUT
      - name: Poczekaj (max 50 min)
        run: |
          STATUS="UNKNOWN"
          for i in $(seq 1 150); do
            STATUS=$(curl -s "https://api.apify.com/v2/actor-runs/${{ steps.run_actor.outputs.run_id }}?token=${{ secrets.APIFY_TOKEN }}" \
              | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['data']['status'])" 2>/dev/null || echo "PARSE_ERR")
            echo "  [${{ matrix.region }}/${{ matrix.property }}] $STATUS ($i/150)"
            case "$STATUS" in
              SUCCEEDED|FAILED|ABORTED|TIMED-OUT|TIMEOUT) break ;;
            esac
            sleep 20
          done
          if [ "$STATUS" != "SUCCEEDED" ]; then
            echo "⚠️ [${{ matrix.region }}/${{ matrix.property }}] $STATUS"
            exit 0
          fi
      - name: Import do MongoDB
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'finderdom' }}
        run: |
          python scripts/import_apify.py --dataset-id ${{ steps.run_actor.outputs.dataset_id }} --property ${{ matrix.property }}
